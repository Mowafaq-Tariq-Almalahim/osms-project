<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — School Management</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="page-center">
    <div class="card card--auth">

      <!-- ===== LOGIN ===== -->
      <div id="login-section">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="login-alert" class="alert" role="alert"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input
              id="login-username"
              class="input"
              type="text"
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
            <span class="field-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <input
                id="login-password"
                class="input"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <button type="button" id="login-toggle-pw" class="password-toggle" aria-label="Show password">Show</button>
            </div>
            <span class="field-error" role="alert"></span>
          </div>

          <button type="submit" id="login-btn" class="btn btn--primary" disabled>Login</button>
        </form>

        <p class="link-text">
          Don't have an account? <a href="#" id="show-register">Sign up</a>
        </p>
      </div>

      <!-- ===== REGISTER ===== -->
      <div id="register-section">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Join the school management system</p>

        <div id="reg-alert" class="alert" role="alert"></div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input
              id="reg-username"
              class="input"
              type="text"
              placeholder="Choose a username"
              autocomplete="username"
              required
            >
            <span class="field-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-wrapper">
              <input
                id="reg-password"
                class="input"
                type="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
              >
              <button type="button" id="reg-toggle-pw" class="password-toggle" aria-label="Show password">Show</button>
            </div>
            <span class="field-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="reg-role">Role</label>
            <select id="reg-role" class="select" required>
              <option value="" disabled selected>Select your role</option>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
            <span class="field-error" role="alert"></span>
          </div>

          <button type="submit" id="reg-btn" class="btn btn--primary" disabled>Create account</button>
        </form>

        <p class="link-text">
          Already have an account? <a href="#" id="show-login">Login</a>
        </p>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
