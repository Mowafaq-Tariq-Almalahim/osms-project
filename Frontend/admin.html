<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — School Management</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Header -->
  <header class="dashboard-header">
    <h2>Admin Dashboard</h2>
    <div>
      <span id="admin-name" style="margin-right: 16px; color: var(--color-text-muted); font-size: 0.875rem;"></span>
      <button class="btn btn--outline btn--sm" id="logout-btn">Logout</button>
    </div>
  </header>

  <div class="card card--dashboard" style="margin-bottom: var(--space-lg);">
    <!-- Manage Teachers -->
    <div class="section-header">
      <h3>Manage Teachers</h3>
      <button class="btn btn--primary btn--sm" onclick="alert('Add Teacher — coming soon')">+ Add Teacher</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="teachers-tbody">
          <tr><td colspan="4" style="text-align:center; padding:24px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card card--dashboard">
    <!-- Manage Students -->
    <div class="section-header">
      <h3>Manage Students</h3>
      <button class="btn btn--primary btn--sm" onclick="alert('Add Student — coming soon')">+ Add Student</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Marks</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="students-tbody">
          <tr><td colspan="4" style="text-align:center; padding:24px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/guard.js"></script>
  <script>
    // Set username in header
    const session = getSession();
    document.getElementById('admin-name').textContent = session.username || 'Admin';

    // Logout
    document.getElementById('logout-btn').addEventListener('click', logout);

    // Load teachers
    (async function () {
      const res = await getTeachers();
      const tbody = document.getElementById('teachers-tbody');
      if (res.ok && res.data.length) {
        tbody.innerHTML = res.data.map(t => `
          <tr>
            <td>${t.id}</td>
            <td>${t.name}</td>
            <td>${t.subject}</td>
            <td>
              <button class="btn btn--outline btn--sm" onclick="alert('Edit teacher ${t.id}')">Edit</button>
              <button class="btn btn--danger btn--sm" onclick="alert('Delete teacher ${t.id}')" style="margin-left:4px;">Delete</button>
            </td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--color-text-muted)">No teachers found.</td></tr>';
      }
    })();

    // Load students
    (async function () {
      const res = await getStudents();
      const tbody = document.getElementById('students-tbody');
      if (res.ok && res.data.length) {
        tbody.innerHTML = res.data.map(s => `
          <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.marks}</td>
            <td>
              <button class="btn btn--outline btn--sm" onclick="alert('Edit student ${s.id}')">Edit</button>
              <button class="btn btn--danger btn--sm" onclick="alert('Delete student ${s.id}')" style="margin-left:4px;">Delete</button>
            </td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--color-text-muted)">No students found.</td></tr>';
      }
    })();
  </script>
</body>
</html>
